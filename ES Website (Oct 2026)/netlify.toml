# Error State, static site. No build step: publish the folder as it is.
[build]
  publish = "."
  command = ""

# Pretty URLs without the trailing index.html
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*/index.html"
  to = "/:splat/"
  status = 301
  force = true

# Everything else that misses falls through to the 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    # The booking page frames Google Calendar and the Juno study frames a FigJam
    # board. Fonts come from Google Fonts.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; frame-src https://calendar.google.com https://embed.figma.com https://www.figma.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

# Fingerprint free assets, so keep the cache honest
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# the local preview helper is not part of the deployed site
[[redirects]]
  from = "/serve.py"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
